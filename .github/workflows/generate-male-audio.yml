name: Generate male voice audio

on:
  workflow_dispatch:
  push:
    branches: [main, feature/difficult-words-audio, feature/all-words-audio, fix/audio-leading-silence]
    paths:
      - data.js
      - home-data.js
      - practice-words.js
      - scripts/generate_audio.py
      - .github/workflows/generate-male-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out flashcards
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install speech generator
        run: python -m pip install edge-tts

      - name: Install audio conversion utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          python -m py_compile scripts/generate_audio.py

      - name: Generate British male voice clips with silent lead-in
        run: python scripts/generate_audio.py

      - name: Verify beginning of sample MP3s is silent
        run: |
          python - <<'PY'
          import re
          import subprocess

          examples = [
              'audio/ryan/work/1.mp3',
              'audio/thomas/home/1.mp3',
              'audio/ryan/words/straightforward.mp3',
              'audio/thomas/words/i_ll.mp3',
          ]
          for sound in examples:
              check = subprocess.run(
                  ['ffmpeg', '-nostdin', '-hide_banner', '-i', sound,
                   '-af', 'silencedetect=noise=-40dB:d=0.35', '-f', 'null', '-'],
                  capture_output=True, text=True, check=True,
              )
              intervals = re.findall(r'silence_end:\s*([0-9.]+)', check.stderr)
              if not intervals or float(intervals[0]) < 0.40:
                  raise RuntimeError(f'Start silence not detected in {sound}: {intervals}')
              print(f'{sound}: {float(intervals[0]):.2f}s leading silence')
          PY

      - name: Commit MP3s to public site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate British male voice audio clips"
            # Rebase audio-only commits if the target branch receives updates.
            for attempt in 1 2 3 4; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Male voice recordings published."
                exit 0
              fi
              echo "Remote changed during push; retrying ($attempt/4)."
              sleep 2
            done
            echo "Could not publish audio after retries."
            exit 1
          else
            echo "All voice recordings are up to date."
          fi
