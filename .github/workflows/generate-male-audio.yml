name: Generate male voice audio

on:
  workflow_dispatch:
  push:
    branches: [main, feature/difficult-words-audio]
    paths:
      - data.js
      - home-data.js
      - practice-words.js
      - scripts/generate_audio.py
      - .github/workflows/generate-male-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out flashcards
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install speech generator
        run: python -m pip install edge-tts

      - name: Generate British male voice clips
        run: python scripts/generate_audio.py

      - name: Commit MP3s to public site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate British male voice audio clips"
            # Rebase audio-only commits if the target branch receives updates.
            for attempt in 1 2 3 4; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Male voice recordings published."
                exit 0
              fi
              echo "Remote changed during push; retrying ($attempt/4)."
              sleep 2
            done
            echo "Could not publish audio after retries."
            exit 1
          else
            echo "All voice recordings are up to date."
          fi
