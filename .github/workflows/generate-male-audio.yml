name: Generate male voice audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data.js
      - home-data.js
      - scripts/generate_audio.py
      - .github/workflows/generate-male-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out flashcards
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install speech generator
        run: python -m pip install edge-tts

      - name: Generate British male voice clips
        run: python scripts/generate_audio.py

      - name: Commit MP3s to public site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate British male voice audio clips"
            git push
          else
            echo "All voice recordings are up to date."
          fi
