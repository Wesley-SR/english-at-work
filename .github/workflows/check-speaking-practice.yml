name: Check speaking practice

on:
  push:
    branches:
      - feature/speaking-practice-free
      - feature/difficult-words-audio
  pull_request:
    paths:
      - 'speaking.mjs'
      - 'history-guard.mjs'
      - 'tests/speaking.test.mjs'
      - 'tests/history-guard.test.mjs'
      - 'app.js'
      - 'practice-words.js'
      - 'scripts/generate_audio.py'
      - 'tests/practice-words.test.mjs'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/check-speaking-practice.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test speaking comparison and history protection
        run: node --test tests/*.test.mjs
      - name: Check browser module syntax
        run: |
          node --check speaking.mjs
          node --check history-guard.mjs
          node --check app.js
          node --check practice-words.js
